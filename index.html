<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Key & Scale Metronome</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            color: #fff;
            margin-top: 20px;
            padding: 10px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        .controls label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        input, select, button {
            padding: 12px;
            font-size: 16px;
            background: #3d3d3d;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            flex: 1;
            min-width: 120px;
        }
        input[type="number"] {
            flex: 0 0 80px;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            margin-top: 10px;
            flex: 100%;
        }
        button.stop {
            background: #f44336;
        }
        #staff-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label>Tempo (BPM): <input type="number" id="tempo" value="60" min="30" max="240"></label>
        <label>Key / Mode: 
            <select id="scaleMode">
                <optgroup label="Modes">
                    <option value="chromatic">Chromatic</option>
                </optgroup>
                <optgroup label="Major Keys">
                    <option value="C_Maj">C Major</option>
                    <option value="G_Maj">G Major (1♯)</option>
                    <option value="D_Maj">D Major (2♯)</option>
                    <option value="A_Maj">A Major (3♯)</option>
                    <option value="E_Maj">E Major (4♯)</option>
                    <option value="B_Maj">B Major (5♯)</option>
                    <option value="Fs_Maj">F♯ Major (6♯)</option>
                    <option value="F_Maj">F Major (1♭)</option>
                    <option value="Bb_Maj">B♭ Major (2♭)</option>
                    <option value="Eb_Maj">E♭ Major (3♭)</option>
                    <option value="Ab_Maj">A♭ Major (4♭)</option>
                    <option value="Db_Maj">D♭ Major (5♭)</option>
                    <option value="Gb_Maj">G♭ Major (6♭)</option>
                </optgroup>
                <optgroup label="Harmonic Minor Keys">
                    <option value="A_MinH">A Harmonic Minor</option>
                    <option value="E_MinH">E Harmonic Minor</option>
                    <option value="B_MinH">B Harmonic Minor</option>
                    <option value="Fs_MinH">F♯ Harmonic Minor</option>
                    <option value="Cs_MinH">C♯ Harmonic Minor</option>
                    <option value="Gs_MinH">G♯ Harmonic Minor</option>
                    <option value="D_MinH">D Harmonic Minor</option>
                    <option value="G_MinH">G Harmonic Minor</option>
                    <option value="C_MinH">C Harmonic Minor</option>
                    <option value="F_MinH">F Harmonic Minor</option>
                    <option value="Bb_MinH">B♭ Harmonic Minor</option>
                    <option value="Eb_MinH">E♭ Harmonic Minor</option>
                </optgroup>
            </select>
        </label>
        <label>Max Interval: 
            <select id="maxInterval">
                <option value="18">No Limit</option>
                <option value="1">2nd (Step)</option>
                <option value="2">3rd</option>
                <option value="3">4th</option>
                <option value="4">5th</option>
                <option value="5">6th</option>
                <option value="6">7th</option>
                <option value="7">Octave</option>
            </select>
        </label>
        <button id="toggleBtn">Start</button>
    </div>

    <div id="staff-container">
        <svg id="staff" width="300" height="240" viewBox="0 -10 300 220" xmlns="http://www.w3.org/2000/svg">
            <line x1="10" y1="50" x2="290" y2="50" stroke="black" stroke-width="2"/>
            <line x1="10" y1="70" x2="290" y2="70" stroke="black" stroke-width="2"/>
            <line x1="10" y1="90" x2="290" y2="90" stroke="black" stroke-width="2"/>
            <line x1="10" y1="110" x2="290" y2="110" stroke="black" stroke-width="2"/>
            <line x1="10" y1="130" x2="290" y2="130" stroke="black" stroke-width="2"/>
            
            <text x="20" y="115" font-size="80" font-family="serif" fill="black">&#119070;</text>
            
            <g id="noteGroup" style="display: none;">
                <g id="ledgerGroup"></g>
                <ellipse id="noteHead" cx="180" cy="90" rx="10" ry="7" fill="black" transform="rotate(-20 180 90)"/>
                <text id="accidentalText" x="145" y="95" font-size="28" font-family="serif" fill="black"></text>
            </g>
        </svg>
    </div>

    <script>
        let audioCtx;
        let isPlaying = false;
        let nextNoteTime = 0.0;
        let prevNoteIndex = -1;
        let timerID;
        const lookahead = 0.1;

        const uiTempo = document.getElementById('tempo');
        const uiMode = document.getElementById('scaleMode');
        const uiMaxInterval = document.getElementById('maxInterval');
        const btn = document.getElementById('toggleBtn');
        const noteGroup = document.getElementById('noteGroup');
        const noteHead = document.getElementById('noteHead');
        const ledgerGroup = document.getElementById('ledgerGroup');
        const accidentalText = document.getElementById('accidentalText');

        const baseStaff = [
            { y: 180, step: 'G' }, { y: 170, step: 'A' }, { y: 160, step: 'B' }, { y: 150, step: 'C' },
            { y: 140, step: 'D' }, { y: 130, step: 'E' }, { y: 120, step: 'F' }, { y: 110, step: 'G' },
            { y: 100, step: 'A' }, { y: 90, step: 'B' }, { y: 80, step: 'C' }, { y: 70, step: 'D' },
            { y: 60, step: 'E' }, { y: 50, step: 'F' }, { y: 40, step: 'G' }, { y: 30, step: 'A' },
            { y: 20, step: 'B' }, { y: 10, step: 'C' }
        ];

        const scaleMap = {
            'C_Maj': {},
            'G_Maj': { 'F': '♯' },
            'D_Maj': { 'F': '♯', 'C': '♯' },
            'A_Maj': { 'F': '♯', 'C': '♯', 'G': '♯' },
            'E_Maj': { 'F': '♯', 'C': '♯', 'G': '♯', 'D': '♯' },
            'B_Maj': { 'F': '♯', 'C': '♯', 'G': '♯', 'D': '♯', 'A': '♯' },
            'Fs_Maj': { 'F': '♯', 'C': '♯', 'G': '♯', 'D': '♯', 'A': '♯', 'E': '♯' },
            'F_Maj': { 'B': '♭' },
            'Bb_Maj': { 'B': '♭', 'E': '♭' },
            'Eb_Maj': { 'B': '♭', 'E': '♭', 'A': '♭' },
            'Ab_Maj': { 'B': '♭', 'E': '♭', 'A': '♭', 'D': '♭' },
            'Db_Maj': { 'B': '♭', 'E': '♭', 'A': '♭', 'D': '♭', 'G': '♭' },
            'Gb_Maj': { 'B': '♭', 'E': '♭', 'A': '♭', 'D': '♭', 'G': '♭', 'C': '♭' },
            'A_MinH': { 'G': '♯' },
            'E_MinH': { 'F': '♯', 'D': '♯' },
            'B_MinH': { 'F': '♯', 'C': '♯', 'A': '♯' },
            'Fs_MinH': { 'F': '♯', 'C': '♯', 'G': '♯', 'E': '♯' },
            'Cs_MinH': { 'F': '♯', 'C': '♯', 'G': '♯', 'D': '♯', 'B': '♯' },
            'Gs_MinH': { 'F': '𝄪', 'C': '♯', 'G': '♯', 'D': '♯', 'A': '♯' },
            'D_MinH': { 'B': '♭', 'C': '♯' },
            'G_MinH': { 'B': '♭', 'E': '♭', 'F': '♯' },
            'C_MinH': { 'E': '♭', 'A': '♭' }, 
            'F_MinH': { 'B': '♭', 'A': '♭', 'D': '♭' },
            'Bb_MinH': { 'B': '♭', 'E': '♭', 'D': '♭', 'G': '♭' },
            'Eb_MinH': { 'B': '♭', 'E': '♭', 'A': '♭', 'G': '♭', 'C': '♭' }
        };

        function unlockAudioContext() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
        }

        function playClick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.value = 800; 
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            
            osc.start(time);
            osc.stop(time + 0.1);
        }

        function drawLedgerLines(cy) {
            ledgerGroup.innerHTML = ''; 
            const createLine = (y) => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '155');
                line.setAttribute('y1', y);
                line.setAttribute('x2', '205');
                line.setAttribute('y2', y);
                line.setAttribute('stroke', 'black');
                line.setAttribute('stroke-width', '2');
                ledgerGroup.appendChild(line);
            };
            
            if (cy <= 30) {
                for (let l = 30; l >= cy; l -= 20) {
                    createLine(l);
                }
            } 
            else if (cy >= 150) {
                for (let l = 150; l <= cy; l += 20) {
                    createLine(l);
                }
            }
        }

        function generateNote() {
            const maxInt = parseInt(uiMaxInterval.value);
            let validIndices = [];
            
            for (let i = 0; i < baseStaff.length; i++) {
                if (prevNoteIndex === -1) {
                    validIndices.push(i);
                } else {
                    const diff = Math.abs(i - prevNoteIndex);
                    if (diff > 0 && diff <= maxInt) {
                        validIndices.push(i);
                    }
                }
            }

            if (validIndices.length === 0) validIndices = [Math.floor(Math.random() * baseStaff.length)];
            
            const nextIndex = validIndices[Math.floor(Math.random() * validIndices.length)];
            prevNoteIndex = nextIndex;
            const noteObj = baseStaff[nextIndex];
            
            const mode = uiMode.value;
            let accidental = '';

            if (mode === 'chromatic') {
                const accs = ['', '♯', '♭'];
                accidental = accs[Math.floor(Math.random() * accs.length)];
            } else {
                accidental = scaleMap[mode][noteObj.step] || '';
            }

            setTimeout(() => {
                noteGroup.style.display = 'block';
                noteHead.setAttribute('cy', noteObj.y);
                noteHead.setAttribute('transform', `rotate(-20 180 ${noteObj.y})`);
                
                drawLedgerLines(noteObj.y);
                
                accidentalText.textContent = accidental;
                accidentalText.setAttribute('y', noteObj.y + 8); 
            }, Math.max(0, (nextNoteTime - audioCtx.currentTime) * 1000));
        }

        function schedule() {
            while (nextNoteTime < audioCtx.currentTime + lookahead) {
                playClick(nextNoteTime);
                generateNote();

                const secondsPerBeat = 60.0 / parseInt(uiTempo.value);
                nextNoteTime += secondsPerBeat;
            }
            timerID = requestAnimationFrame(schedule);
        }

        btn.addEventListener('click', () => {
            if (!isPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                unlockAudioContext();
                
                isPlaying = true;
                btn.textContent = 'Stop';
                btn.classList.add('stop');
                
                prevNoteIndex = -1;
                nextNoteTime = audioCtx.currentTime + 0.1;
                schedule();
            } else {
                isPlaying = false;
                btn.textContent = 'Start';
                btn.classList.remove('stop');
                cancelAnimationFrame(timerID);
                noteGroup.style.display = 'none';
            }
        });
    </script>
</body>
</html>
